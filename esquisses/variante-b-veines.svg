<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="Kyanite">
  <title>Kyanite — B — facettes + veines</title>

  <!-- silhouette : evite tout liseré entre facettes adjacentes -->
  <path d="M12,14 H34 V86 H12 Z M34,24 L49,14 H88 L34,50 Z M34,50 L88,86 H49 L34,76 Z" fill="#3F7AD0"/>

  <!-- jambage : face eclairee a gauche, face d'ombre a droite -->
  <g id="jambage">
    <polygon points="12,14 16,14 16,86 12,86" fill="#4F8EE0"/>
    <polygon points="16,14 17.5,14 17.5,86 16,86" fill="#68A4EB"/>
    <polygon points="17.5,14 21,14 21,86 17.5,86" fill="#4F8EE0"/>
    <polygon points="21,14 26,14 26,86 21,86" fill="#27559F"/>
    <polygon points="26,14 27.2,14 27.2,86 26,86" fill="#1E4684"/>
    <polygon points="27.2,14 34,14 34,86 27.2,86" fill="#27559F"/>
  </g>

  <!-- branche haute : lame la plus fine, donc la plus claire -->
  <g id="branche-haute">
    <polygon points="34,24 49,14 55,14 34,28" fill="#8CBDF3"/>
    <polygon points="34,28 55,14 56.8,14 34,29.2" fill="#B5D5F9"/>
    <polygon points="34,29.2 56.8,14 64,14 34,34" fill="#8CBDF3"/>
    <polygon points="34,34 64,14 73,14 34,40" fill="#3F7AD0"/>
    <polygon points="34,40 73,14 75.1,14 34,41.4" fill="#3267B8"/>
    <polygon points="34,41.4 75.1,14 88,14 34,50" fill="#3F7AD0"/>
  </g>

  <!-- branche basse -->
  <g id="branche-basse">
    <polygon points="34,50 88,86 80.5,86 34,55" fill="#68A4EB"/>
    <polygon points="34,55 80.5,86 78.7,86 34,56.2" fill="#8CBDF3"/>
    <polygon points="34,56.2 78.7,86 73,86 34,60" fill="#68A4EB"/>
    <polygon points="34,60 73,86 64,86 34,66" fill="#3F7AD0"/>
    <polygon points="34,66 64,86 62.05,86 34,67.3" fill="#3267B8"/>
    <polygon points="34,67.3 62.05,86 49,86 34,76" fill="#3F7AD0"/>
  </g>
</svg>
