<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="Kyanite">
  <title>Kyanite — C — branche haute fendue</title>

  <!-- silhouette : evite tout liseré entre facettes adjacentes -->
  <path d="M12,14 H34 V86 H12 Z M34,24 L49,14 H88 L34,50 Z M34,50 L88,86 H49 L34,76 Z" fill="#3F7AD0"/>

  <!-- jambage : face eclairee a gauche, face d'ombre a droite -->
  <g id="jambage">
    <polygon points="12,14 21,14 21,86 12,86" fill="#4F8EE0"/>
    <polygon points="21,14 34,14 34,86 21,86" fill="#27559F"/>
  </g>

  <!-- branche haute : lame la plus fine, donc la plus claire -->
  <g id="branche-haute">
    <polygon points="34,24 49,14 64,14 34,34" fill="#8CBDF3"/>
    <polygon points="34,34 64,14 88,14 34,50" fill="#3F7AD0"/>
    <!-- fente : paroi a l'ombre, coeur brillant, retombee -->
    <polygon points="40,30 60,14 62.5,14" fill="#1A3A72"/>
    <polygon points="40,30 62.5,14 65.5,14" fill="#EAF4FF"/>
    <polygon points="40,30 65.5,14 68,14" fill="#C3DDFA"/>
    <polygon points="50,26 77,14 79,14" fill="#C3DDFA"/>
  </g>

  <!-- branche basse -->
  <g id="branche-basse">
    <polygon points="34,50 88,86 73,86 34,60" fill="#68A4EB"/>
    <polygon points="34,60 73,86 49,86 34,76" fill="#3F7AD0"/>
  </g>
</svg>
